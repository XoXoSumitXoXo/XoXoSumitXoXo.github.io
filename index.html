<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Date Proposal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff5f7;
    overflow:hidden;
}

.flower{
    position:absolute;
    font-size:25px;
    animation:float 8s linear infinite;
    opacity:.6;
}

@keyframes float{
    from{
        transform:translateY(100vh) rotate(0deg);
    }
    to{
        transform:translateY(-120vh) rotate(360deg);
    }
}

.card{
    width:420px;
    background:white;
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    animation:pop .5s ease;
}

@keyframes pop{
    from{
        transform:scale(.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

img{
    width:130px;
    height:130px;
    object-fit:cover;
    border-radius:20px;
}

h1{
    margin:20px 0;
    color:#5a2d3f;
    font-size:35px;
}

.buttons{
    margin-top:20px;
    position:relative;
    height:90px;
}

button{
    border:none;
    padding:14px 30px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

#yes{
    background:#ff8fc7;
    color:white;
}

#yes:hover{
    transform:scale(1.08);
}

#no{
    background:#d8c2ff;
    color:#444;
    position:absolute;
    left:220px;
}

.success{
    display:none;
    font-size:30px;
    color:#ff4f8b;
    margin-top:20px;
}
</style>
</head>
<body>

<div class="card">

    <!-- Replace puppy.jpg with your image -->
    <img src="https://cdn2.thecatapi.com/images/MTY3ODIyMQ.jpg" alt="cute">

    <h1>🌸 Will you go on a date with me? 🌸</h1>

    <div class="buttons">
        <button id="yes">YES 💕</button>
        <button id="no">no... 🙈</button>
    </div>

    <div class="success">
        💖 YAYYYYY!!! 💖
    </div>

</div>

<script>

// Floating flowers
for(let i=0;i<20;i++){
    let flower=document.createElement("div");
    flower.className="flower";
    flower.innerHTML="🌸";

    flower.style.left=Math.random()*100+"vw";
    flower.style.animationDuration=(5+Math.random()*6)+"s";
    flower.style.fontSize=(15+Math.random()*20)+"px";

    document.body.appendChild(flower);
}

// Runaway NO button
const noBtn=document.getElementById("no");

noBtn.addEventListener("mouseover",()=>{

    const x=Math.random()*(window.innerWidth-120);
    const y=Math.random()*(window.innerHeight-80);

    noBtn.style.position="fixed";
    noBtn.style.left=x+"px";
    noBtn.style.top=y+"px";
});

// YES button
document.getElementById("yes").onclick=()=>{

    document.querySelector(".buttons").style.display="none";

    document.querySelector(".success").style.display="block";

    document.querySelector("h1").innerHTML=
    "💖 Best decision ever! 💖";
};
</script>

</body>
</html>
